<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#65754d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="خُطّتي"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>خُطّتي | تنظيم يومك</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#29352b;background:#f7f7f1}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;padding:22px 16px 100px}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-size:29px;font-weight:850;color:#586d40}.muted{color:#788073;font-size:13px}.card{background:#fff;border:1px solid #e8ebdf;border-radius:21px;padding:19px;margin:16px 0;box-shadow:0 3px 14px #34442308}.hero{background:#e8eedf}.progress{height:11px;border-radius:20px;background:#d4dfca;overflow:hidden;margin-top:14px}.progress>div{height:100%;background:#647e4c;transition:width .2s}.btn{border:0;background:#657b50;color:#fff;border-radius:13px;padding:12px 17px;font-weight:700}.ghost{border:1px solid #d7dfce;background:#fff;color:#4b6140;border-radius:12px;padding:9px 12px}.danger{color:#b64f43}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.task{display:flex;gap:11px;align-items:flex-start;padding:13px 0;border-bottom:1px solid #edf0e9}.task:last-child{border:0}.check{width:24px;height:24px;accent-color:#627b4b;flex:none}.taskmain{flex:1;min-width:0}.taskname{font-weight:750;overflow-wrap:anywhere}.done .taskname{text-decoration:line-through;color:#8b9685}.meta{color:#7d8677;font-size:12px;margin-top:5px}.chip{display:inline-block;border-radius:12px;padding:3px 8px;background:#f1f3eb;color:#637452;font-size:11px}.high{background:#fbe7e4;color:#a64b42}.medium{background:#fff1d5;color:#9a6c18}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.actions button{font-size:12px;padding:6px 9px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e9df;display:flex;justify-content:space-around;padding:8px 3px calc(8px + env(safe-area-inset-bottom));z-index:10}.nav button{border:0;background:transparent;color:#7d8875;font-size:11px;padding:8px 3px;min-width:18%}.nav button.active{color:#526c3c;font-weight:800}.nav span{display:block;font-size:20px;margin-bottom:4px}h1{font-size:23px;margin:16px 0 4px}h2{font-size:17px;margin:0 0 12px}.empty{text-align:center;padding:25px;color:#8b9584}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{text-align:center}.metric strong{display:block;font-size:29px;color:#5d7549}dialog{width:min(94vw,540px);max-height:88dvh;overflow:auto;border:0;border-radius:22px;padding:20px;background:#fbfcf8}dialog::backdrop{background:#1e2b1c99}label{display:block;font-weight:650;font-size:13px;margin:12px 0 5px}input:not([type=checkbox]),textarea,select{width:100%;border:1px solid #dbe1d4;border-radius:11px;padding:12px;background:white;color:#263524}textarea{resize:vertical}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.footerbuttons{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.notice{background:#fff3db;border-radius:12px;padding:12px;font-size:13px;color:#80601d}.tabs{display:flex;gap:8px;overflow:auto;padding:5px 0}.tabs button{white-space:nowrap}.tabs .selected{background:#657b50;color:white}.dark{background:#1c241d;color:#e5eadd}.dark .card,.dark .nav,.dark dialog{background:#2b352a;color:#e5eadd;border-color:#43513f}.dark input,.dark textarea,.dark select,.dark .ghost{background:#354133;color:#e5eadd;border-color:#53614c}.dark .hero{background:#344431}@media(min-width:700px){.nav{max-width:760px;margin:auto;border-radius:20px 20px 0 0}}
</style></head><body><main id="app" class="app"></main><nav id="nav" class="nav"></nav><dialog id="editor"><form id="taskForm"><h2 id="formTitle">مهمة جديدة</h2><input type="hidden" id="tid"><label>اسم المهمة *</label><input id="name" maxlength="120" required><label>الوصف (اختياري)</label><textarea id="desc" rows="2"></textarea><label>التاريخ *</label><input id="date" type="date" required><div class="formrow"><div><label>البداية *</label><input id="start" type="time" required></div><div><label>النهاية *</label><input id="end" type="time" required></div></div><p class="muted" id="duration"></p><div class="formrow"><div><label>الأولوية</label><select id="priority"><option value="high">عالية</option><option value="medium" selected>متوسطة</option><option value="low">منخفضة</option></select></div><div><label>التصنيف</label><select id="category"><option>دراسة</option><option>عمل</option><option>رياضة</option><option>شخصي</option><option>أخرى</option></select></div></div><label>التكرار</label><select id="repeat"><option value="none">بدون تكرار</option><option value="daily">يوميًا</option><option value="weekly">أسبوعيًا</option></select><div id="suggest" class="muted" style="margin-top:12px"></div><div class="footerbuttons"><button class="ghost" type="button" onclick="editor.close()">إلغاء</button><button class="btn" type="submit">حفظ المهمة</button></div></form></dialog><script>
'use strict';const K='khutati_pwa_v1',S='khutati_settings_v1';let tasks=[],settings={notifications:false,theme:'light',name:''},page='home',weekOffset=0,dayOffset=0,filter='all';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function load(){try{tasks=JSON.parse(localStorage.getItem(K)||'[]');settings={...settings,...JSON.parse(localStorage.getItem(S)||'{}')}}catch(e){alert('تعذر قراءة البيانات المحفوظة')}}function save(){try{localStorage.setItem(K,JSON.stringify(tasks));localStorage.setItem(S,JSON.stringify(settings))}catch(e){alert('تعذر الحفظ؛ تحقق من مساحة المتصفح')}}function dateStr(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function shift(s,n){let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return dateStr(d)}function today(){return dateStr(new Date())}function mins(s){let [h,m]=s.split(':').map(Number);return h*60+m}function time(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}function occurs(t,d){if(d<t.date)return false;if(t.repeat==='none')return d===t.date;let a=new Date(t.date+'T12:00:00'),b=new Date(d+'T12:00:00'),days=Math.round((b-a)/86400000);return t.repeat==='daily'||(t.repeat==='weekly'&&days%7===0)}function completed(t,d){return (t.completed||[]).includes(d)}function list(d){return tasks.filter(t=>occurs(t,d)).sort((a,b)=>mins(a.start)-mins(b.start))}function overlap(a,b){return mins(a.start)<mins(b.end)&&mins(b.start)<mins(a.end)}function conflicts(candidate,except){let dates=[];for(let i=0;i<365;i++)dates.push(shift(candidate.date,i));return tasks.filter(t=>t.id!==except&&dates.some(d=>occurs(candidate,d)&&occurs(t,d)&&overlap(candidate,t)))}function suggestions(t){let slots=[];for(let m=7*60;m+mins(t.end)-mins(t.start)<=22*60;m+=15){let c={...t,start:time(m),end:time(m+mins(t.end)-mins(t.start))};if(!conflicts(c,t.id).length){slots.push(c.start+'–'+c.end);if(slots.length===3)break}}return slots}function titleDate(d){return new Intl.DateTimeFormat('ar-SA',{weekday:'long',day:'numeric',month:'long'}).format(new Date(d+'T12:00:00'))}function rate(d){let a=list(d);return a.length?Math.round(a.filter(t=>completed(t,d)).length/a.length*100):0}function button(text,fn,cl='ghost'){return `<button class="${cl}" onclick="${fn}">${text}</button>`}function taskHtml(t,d){return `<div class="task ${completed(t,d)?'done':''}"><input class="check" type="checkbox" aria-label="إكمال المهمة" ${completed(t,d)?'checked':''} onchange="toggle('${t.id}','${d}')"><div class="taskmain"><div class="taskname">${esc(t.name)}</div><div class="meta">${t.start} – ${t.end} · ${esc(t.category)} · <span class="chip ${t.priority}">${{high:'عالية',medium:'متوسطة',low:'منخفضة'}[t.priority]}</span> ${t.repeat!=='none'?'· 🔁':''}</div>${t.desc?`<div class="muted">${esc(t.desc)}</div>`:''}<div class="actions">${button('تعديل',`editTask('${t.id}')`)}${button('تأجيل يوم',`postpone('${t.id}','${d}')`)}${button('−15د',`move('${t.id}',-15)`)}${button('+15د',`move('${t.id}',15)`)}${button('حذف',`removeTask('${t.id}')`,'ghost danger')}</div></div></div>`}function tasksBox(d){let a=list(d);return a.length?a.map(t=>taskHtml(t,d)).join(''):'<div class="empty">لا توجد مهام لهذا اليوم 🌱</div>'}function render(){document.body.classList.toggle('dark',settings.theme==='dark');let d=today(),a=list(d),done=a.filter(t=>completed(t,d)).length,html='';if(page==='home'){html=`<div class="top"><div class="brand">خُطّتي 🌿</div><span class="muted">${titleDate(d)}</span></div><h1>مرحبًا ${esc(settings.name||'بك')} 👋</h1><p class="muted">كل خطوة صغيرة تصنع يومًا أفضل.</p><section class="card hero"><div class="toolbar"><b>إنجاز اليوم</b><b>${rate(d)}٪</b></div><div class="progress"><div style="width:${rate(d)}%"></div></div><p class="muted">أنجزت ${done} من ${a.length} مهمة</p></section><div class="toolbar"><h2>مهام اليوم</h2>${button('＋ إضافة مهمة','openNew()','btn')}</div><section class="card">${tasksBox(d)}</section>`}else if(page==='schedule'){let dd=shift(d,dayOffset),start=shift(d,-((new Date(d+'T12:00:00').getDay()+6)%7)+weekOffset*7);html=`<h1>جدولي 📅</h1><section class="card"><div class="toolbar">${button('الأسبوع السابق','weekOffset--;render()')}${button('هذا الأسبوع','weekOffset=0;dayOffset=0;render()')}${button('الأسبوع التالي','weekOffset++;render()')}</div><div class="tabs">${Array.from({length:7},(_,i)=>{let x=shift(start,i);return `<button class="ghost ${x===dd?'selected':''}" onclick="dayOffset=${Math.round((new Date(x+'T12:00:00')-new Date(d+'T12:00:00'))/86400000)};render()">${titleDate(x).split(' ')[0]} ${x.slice(-2)}</button>`}).join('')}</div><h2>${titleDate(dd)}</h2>${tasksBox(dd)}</section>`}else if(page==='tasks'){let dates=new Set();for(let i=0;i<31;i++)dates.add(shift(d,i));tasks.filter(t=>t.repeat==='none').forEach(t=>dates.add(t.date));let items=[...dates].sort().filter(x=>x>=d).flatMap(x=>list(x).map(t=>({t,d:x})));if(filter==='done')items=items.filter(x=>completed(x.t,x.d));if(filter==='pending')items=items.filter(x=>!completed(x.t,x.d));html=`<h1>جميع المهام 🗂️</h1><div class="tabs">${['all','pending','done'].map((f,i)=>button(['الكل','القادمة','المكتملة'][i],`filter='${f}';render()`,filter===f?'btn':'ghost')).join('')}</div><section class="card">${items.length?items.map(x=>`<div class="muted">${titleDate(x.d)}</div>${taskHtml(x.t,x.d)}`).join(''):'<div class="empty">لا توجد مهام في هذا القسم</div>'}</section><p class="muted">تُعرض المهام المتكررة خلال 31 يومًا قادمًا.</p>`}else if(page==='stats'){let dates=Array.from({length:30},(_,i)=>shift(d,-i)),daily=list(d),weekly=dates.slice(0,7).flatMap(x=>list(x).map(t=>({t,d:x}))),monthly=dates.flatMap(x=>list(x).map(t=>({t,d:x}))),stat=x=>x.length?Math.round(x.filter(y=>completed(y.t,y.d)).length/x.length*100):0;html=`<h1>الإحصائيات 📊</h1><div class="grid"><div class="card metric"><strong>${rate(d)}٪</strong>اليوم</div><div class="card metric"><strong>${stat(weekly)}٪</strong>آخر 7 أيام</div><div class="card metric"><strong>${stat(monthly)}٪</strong>آخر 30 يومًا</div><div class="card metric"><strong>${tasks.length}</strong>المهام المسجلة</div></div><section class="card"><h2>الإنجاز اليومي</h2>${dates.slice(0,7).reverse().map(x=>`<div class="muted">${titleDate(x)} · ${rate(x)}٪</div><div class="progress" style="margin:5px 0 13px"><div style="width:${rate(x)}%"></div></div>`).join('')}</section>`}else{html=`<h1>الإعدادات ⚙️</h1><section class="card"><label>اسمك</label><input id="username" value="${esc(settings.name)}" placeholder="اسمك" maxlength="50"><label>المظهر</label><select id="theme"><option value="light" ${settings.theme==='light'?'selected':''}>فاتح</option><option value="dark" ${settings.theme==='dark'?'selected':''}>داكن</option></select><label>التنبيهات داخل التطبيق</label><select id="notify"><option value="off" ${!settings.notifications?'selected':''}>إيقاف</option><option value="on" ${settings.notifications?'selected':''}>تشغيل</option></select><p class="notice">تنبيهات نسخة الويب تظهر أثناء فتح التطبيق فقط. الإشعارات في الخلفية على iPhone تحتاج خدمة Push وخادمًا مخصصًا.</p>${button('حفظ الإعدادات','saveSettings()','btn')}</section><section class="card"><h2>نسخ احتياطي</h2><p class="muted">البيانات محفوظة على هذا المتصفح والجهاز فقط. احفظ نسخة احتياطية بانتظام.</p>${button('تصدير JSON','exportData()')}&nbsp;${button('استيراد JSON','importData()')}<input type="file" id="importFile" accept="application/json,.json" hidden onchange="readImport(this)"></section><section class="card"><h2>عن التطبيق</h2><p class="muted">خُطّتي — نسخة PWA مستقلة. لا توجد حسابات أو مزامنة سحابية في هذه النسخة.</p></section>`} $('app').innerHTML=html;$('nav').innerHTML=[['home','⌂','الرئيسية'],['schedule','▦','جدولي'],['tasks','☑','المهام'],['stats','▥','الإحصائيات'],['settings','⚙','الإعدادات']].map(([p,i,n])=>`<button class="${page===p?'active':''}" onclick="page='${p}';render()"><span>${i}</span>${n}</button>`).join('')}function openNew(){let f=$('taskForm');f.reset();$('tid').value='';$('date').value=today();$('start').value='09:00';$('end').value='10:00';$('formTitle').textContent='إضافة مهمة';updateDuration();$('editor').showModal()}function editTask(id){let t=tasks.find(x=>x.id===id);if(!t)return;openNew();for(let k of ['name','desc','date','start','end','priority','category','repeat'])$(k).value=t[k];$('tid').value=id;$('formTitle').textContent='تعديل المهمة';updateDuration()}function updateDuration(){let s=$('start').value,e=$('end').value,n=s&&e?mins(e)-mins(s):0;$('duration').textContent=n>0?'المدة: '+Math.floor(n/60)+' ساعة و'+n%60+' دقيقة':'يجب أن تكون النهاية بعد البداية'}$('start').onchange=updateDuration;$('end').onchange=updateDuration;$('taskForm').onsubmit=e=>{e.preventDefault();let id=$('tid').value,t={id:id||((crypto.randomUUID&&crypto.randomUUID())||String(Date.now())),name:$('name').value.trim(),desc:$('desc').value.trim(),date:$('date').value,start:$('start').value,end:$('end').value,priority:$('priority').value,category:$('category').value,repeat:$('repeat').value,completed:id?(tasks.find(x=>x.id===id)?.completed||[]):[]};if(!t.name||!t.date||mins(t.end)<=mins(t.start)){alert('تحقق من الاسم والوقت');return}let bad=conflicts(t,id);if(bad.length){let ss=suggestions(t);$('suggest').textContent='تعارض مع: '+bad.map(x=>x.name).join('، ')+(ss.length?' | أوقات مقترحة: '+ss.join('، '):'');return}if(id)tasks=tasks.map(x=>x.id===id?t:x);else tasks.push(t);save();$('editor').close();render()};function toggle(id,d){let t=tasks.find(x=>x.id===id);if(!t)return;t.completed=t.completed||[];t.completed=t.completed.includes(d)?t.completed.filter(x=>x!==d):[...t.completed,d];save();render()}function removeTask(id){if(!confirm('حذف هذه المهمة وكل تكراراتها؟'))return;tasks=tasks.filter(t=>t.id!==id);save();render()}function move(id,delta){let t=tasks.find(x=>x.id===id),n=mins(t.start)+delta,m=mins(t.end)+delta;if(n<0||m>1440){alert('الوقت خارج اليوم');return}let c={...t,start:time(n),end:time(m)};if(conflicts(c,id).length){alert('الوقت الجديد يتعارض مع مهمة أخرى');return}Object.assign(t,c);save();render()}function postpone(id,d){let t=tasks.find(x=>x.id===id);if(!t)return;if(t.repeat!=='none'){alert('لتأجيل مهمة متكررة، عدّل تاريخ بداية السلسلة من زر تعديل');return}let c={...t,date:shift(d,1)};if(conflicts(c,id).length){alert('يوجد تعارض في اليوم التالي');return}t.date=c.date;t.completed=[];save();render()}function saveSettings(){settings.name=$('username').value.trim();settings.theme=$('theme').value;settings.notifications=$('notify').value==='on';save();render()}function exportData(){let blob=new Blob([JSON.stringify({tasks,settings,version:1},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='khutati-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}function importData(){$('importFile').click()}function readImport(el){let file=el.files?.[0];if(!file)return;file.text().then(txt=>{let data=JSON.parse(txt);if(!Array.isArray(data.tasks)||!data.tasks.every(t=>typeof t.name==='string'&&typeof t.date==='string'&&typeof t.start==='string'&&typeof t.end==='string'))throw Error('ملف غير صالح');if(!confirm('استبدال جميع مهامك الحالية بالنسخة الاحتياطية؟'))return;tasks=data.tasks;settings={...settings,...data.settings};save();render()}).catch(()=>alert('تعذر استيراد الملف'))}load();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});let notified=new Set();setInterval(()=>{if(!settings.notifications)return;let now=new Date(),d=today(),m=now.getHours()*60+now.getMinutes();list(d).forEach(t=>{let key=t.id+d;if(!completed(t,d)&&mins(t.start)-m<=5&&mins(t.start)-m>=0&&!notified.has(key)){notified.add(key);alert('تذكير: '+t.name+' تبدأ الساعة '+t.start)}})},30000);
</script></body></html>
